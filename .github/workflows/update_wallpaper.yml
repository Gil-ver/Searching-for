name: Update Bing Wallpaper & Logo Detection

# 北京时间 12:00~23:59 每 10 分钟高频触发；脚本内置当天去重，成功一次后当天跳过
on:
  schedule:
    - cron: '*/10 4-15 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'index_files/wallpaper/update_wallpaper.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Run wallpaper update script
        run: python "index_files/wallpaper/update_wallpaper.py"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "index_files/wallpaper/staging/" "index_files/wallpaper/prod/"
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "[auto] Update wallpaper & logo detection ($(date -u +%Y-%m-%d))"
            git push
            echo "Wallpaper updated and pushed."
          fi
