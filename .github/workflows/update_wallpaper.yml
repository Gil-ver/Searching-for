name: Update Bing Wallpaper & Logo Detection

# 北京时间 17:00~23:59 每 10 分钟高频触发；Bing 壁纸约 16:00 更新，17:00 开始抓取
# 脚本内置当天去重，成功一次后当天跳过
# workflow_dispatch 默认 force=true，手动触发不受去重限制
on:
  schedule:
    - cron: '0,10,20,30,40,50 9-15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run (skip daily dedup)'
        type: boolean
        default: true
  push:
    paths:
      - 'index_files/wallpaper/update_wallpaper.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Run wallpaper update script
        run: python "index_files/wallpaper/update_wallpaper.py" ${{ inputs.force && '--force' || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "index_files/wallpaper/staging/" "index_files/wallpaper/prod/"
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "[auto] Update wallpaper & logo detection ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
            echo "Wallpaper updated and pushed."
          fi
