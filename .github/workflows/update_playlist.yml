name: Update Podcast Playlist

# 每天 UTC 00:00（北京时间 08:00）自动更新歌单
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'index_files/music/update_playlist.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python index_files/music/update_playlist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_files/music/playlist.json index_files/music/_bgm_data.js index_files/music/mp3/
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "[auto] Update podcast playlist ($(date -u +%Y-%m-%d))"
            git push
            echo "Playlist updated and pushed."
          fi
